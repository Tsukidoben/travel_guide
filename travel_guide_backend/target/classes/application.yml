server:
  port: 8088

spring:
  application:
    name: travel_guide
  #    配置数据源
  datasource:
    url: jdbc:mysql://localhost:3306/travel_guide?useUnicode=true&characterSet=utf-8&useSSL=true&serverTimezone=Asia/Shanghai&rewriteBatchedStatements=true
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
    type: com.alibaba.druid.pool.DruidDataSource

    druid:
      initialSize: 5
      minIdle: 5
      maxActive: 20
      maxWait: 60000
      timeBetweenEvictionRunsMillis: 60000
      minEvictableIdleTimeMillis: 300000
      validationQuery: SELECT 1 FROM DUAL
      testWhileIdle: true
      testOnBorrow: false
      testOnReturn: false
      poolPreparedStatements: true
      #配置监控统计拦截的filters，stat：监控统计、log4j：日志记录、wall：防御sql注入
      #如果允许报错，java.lang.ClassNotFoundException: org.apache.Log4j.Properity
      #则导入log4j 依赖就行
      filters: stat,wall,slf4j
      maxPoolPreparedStatementPerConnectionSize: 20
      useGlobalDataSourceStat: true
      connectionProperties: druid.stat.mergeSql=true;druid.stat.slowSqlMillis=500

  #返回json的全局时间格式
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
  # 文件上传大小
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB
  profiles:
    active: dev
  #接入ai
  ai:
    openai:
      api-key: sk-30181d8ec8ab4bd197255db5deb12fc6 # deepseek密钥
      base-url: https://api.deepseek.com
      chat:
        options:
          model: deepseek-chat
  mvc:
    async:
      request-timeout: 180000

deepseek:
  historyCount: 5

com:
  own:
    properties:
      uploadType: local
      login:
        isNeedCaptcha: false
        errorMaxCount: 3
      jwt:
        key: travel_guide
        expireTime: 36000000000

mybatis-plus:
  #  配置逻辑删除默认值
  global-config:
    db-config:
      logic-delete-value: 1 # 逻辑已删除值(默认为 1)
      logic-not-delete-value: 0 # 逻辑未删除值(默认为 0)
  mapper-locations: classpath*:mappers/*.xml

logging:
  config: classpath:logback-spring.xml

# 沙箱支付配置
